<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <script>
        // Apply theme immediately to prevent flash of wrong theme
        (function () {
            try {
                var theme = localStorage.getItem('codearena_theme');
                if (theme !== 'light' && theme !== 'dark') {
                    theme = window.matchMedia
                        && window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }
                document.documentElement.dataset.theme = theme;
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FBEDE8">
    <title>CodeArena — Dashboard</title>
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content" tabindex="-1">
        <div class="dashboard-layout">
            <!-- LEFT COLUMN (Main Content) -->
            <div>
                <!-- Header -->
                <div class="flex gap-16" style="align-items:flex-start;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;">
                    <div>
                        <h1 id="greeting">Welcome back</h1>
                        <p class="muted" id="subtitle">Loading your stats...</p>
                    </div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <a id="view-profile-btn" href="#" class="btn secondary">View Profile</a>
                        <button id="random-problem-btn" class="btn secondary">
                            🎲 Random Problem
                        </button>
                        <a href="problems.html" class="btn">Browse Problems</a>
                    </div>
                </div>

                <!-- Resume Card -->
                <div id="resume-card" class="card mb-24 hidden" style="border-left: 4px solid var(--tertiary); --stagger: 1;">
                    <div class="flex" style="justify-content: space-between; align-items: center;">
                        <div>
                            <h3 style="margin: 0; font-family: var(--font-serif); font-size: 1.2rem;">Pick up where you left off</h3>
                            <p class="muted" style="margin: 4px 0 0;" id="resume-desc">You were working on a problem.</p>
                        </div>
                        <a id="resume-btn" href="#" class="btn">Resume</a>
                    </div>
                </div>

                <!-- Onboarding -->
                <div id="onboarding-container" style="--stagger: 1;"></div>

                <!-- Records -->
                <div class="card-grid mb-24" id="records-grid" style="--stagger: 2;">
                    <!-- Populated via JS -->
                </div>

                <!-- Stats Row -->
                <div class="card-grid mb-24" id="stats-grid" style="--stagger: 3;"></div>

                <!-- Two-column grid for goal & recommendation -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; --stagger: 4;" class="responsive-grid">
                    <!-- Weekly Goal Card -->
                    <div class="card">
                        <div class="card-header">
                            <h3>Weekly Goal</h3>
                        </div>
                        <div id="weekly-goal-container">
                            <div class="loading-block" style="padding: 20px 0;"><span class="spinner"></span></div>
                        </div>
                    </div>

                    <!-- Recommendation Card -->
                    <div class="card">
                        <div class="card-header">
                            <h3>Recommended Next</h3>
                        </div>
                        <div id="recommendation-container">
                            <div class="loading-block" style="padding: 20px 0;"><span class="spinner"></span></div>
                        </div>
                    </div>
                </div>

                <!-- Contest Countdown -->
                <div id="contest-countdown-container" class="mb-24" style="--stagger: 5;"></div>

                <!-- Topic Mastery -->
                <div class="card mb-24" style="--stagger: 6;">
                    <div class="card-header">
                        <h3>Topic Mastery</h3>
                    </div>
                    <div id="topic-mastery-container">
                        <div class="loading-block" style="padding: 20px 0;"><span class="spinner"></span></div>
                    </div>
                </div>

                <!-- Heatmap -->
                <div id="heatmap-container" style="--stagger: 7;"></div>

                <!-- Recent Submissions -->
                <div class="card mb-24" style="--stagger: 8;">
                    <div class="card-header">
                        <h3>Recent Submissions</h3>
                        <a href="history.html" class="muted" style="font-size:12px;">View all →</a>
                    </div>
                    <div id="recent-table"></div>
                </div>
            </div>

            <!-- RIGHT COLUMN (Activity Feed) -->
            <aside style="--stagger: 3;">
                <div class="activity-card">
                    <div class="activity-header">
                        <h3>Live Activity</h3>
                        <span class="muted" style="font-size: 11px;">Global</span>
                    </div>
                    <div class="activity-feed" id="activity-feed">
                        <div class="loading-block" style="padding: 20px 0;">
                            <span class="spinner"></span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script src="static/app.js"></script>

    <script>
        'use strict';

        (function () {
            if (!requireAuth('dashboard')) return;

            const user = Auth.getUser();

            // Contextual greeting
            const hour = new Date().getHours();
            let timeGreeting = 'Welcome back';
            if (hour < 12) timeGreeting = 'Good morning';
            else if (hour < 18) timeGreeting = 'Good afternoon';
            else timeGreeting = 'Good evening';

            document.getElementById('view-profile-btn').href =
                `profile.html?user=${encodeURIComponent(user.username)}`;

            document.getElementById('greeting').textContent =
                `${timeGreeting}, ${user.username}`;

            // 1. Render Skeletons immediately
            document.getElementById('stats-grid').appendChild(Skeleton.statGrid(4));
            document.getElementById('recent-table').appendChild(Skeleton.table(6, 5));

            // Stagger entrance for main dashboard sections
            document.querySelectorAll('#records-grid, #stats-grid, .responsive-grid, #contest-countdown-container, #topic-mastery-container, #heatmap-container, .card.mb-24[style*="--stagger: 8"], aside[style*="--stagger"]').forEach(el => {
                if (el && el.id !== 'records-grid' || true) el.classList.add('anim-rise');
            });
            // be selective to avoid double-adding unrelated nodes
            ['records-grid','stats-grid','contest-countdown-container','topic-mastery-container','heatmap-container'].forEach(id => {
                const n = document.getElementById(id); if (n) n.classList.add('anim-rise');
            });
            const resp = document.querySelector('.responsive-grid'); if (resp) resp.classList.add('anim-rise');
            const recentCard = document.querySelector('#recent-table')?.closest('.card.mb-24'); if (recentCard) recentCard.classList.add('anim-rise');
            const aside = document.querySelector('aside[style*="--stagger"]'); if (aside) aside.classList.add('anim-rise');

            (async function loadDashboard() {
                try {
                    const freshUser = await Api.me();
                    Auth.saveToken(Auth.getToken(), freshUser);

                    // Fetch records to get total distinct solved
                    const records = await apiFetch('/api/stats/records');

                    // Check milestones (solved count & level)
                    checkMilestones(records.total_solved, freshUser.level || 1);

                    const hourNow = new Date().getHours();
                    let timeGreetingNow = 'Welcome back';
                    if (hourNow < 12) timeGreetingNow = 'Good morning';
                    else if (hourNow < 18) timeGreetingNow = 'Good afternoon';
                    else timeGreetingNow = 'Good evening';

                    document.getElementById('greeting').textContent =
                        `${timeGreetingNow}, ${freshUser.username}`;
                    document.getElementById('view-profile-btn').href =
                        `profile.html?user=${encodeURIComponent(freshUser.username)}`;

                    const subs = await Api.listSubmissions(10, 0);
                    const items = subs.items || [];
                    const totalSubs = subs.total || 0;
                    renderOnboarding(freshUser, totalSubs);

                    // Fetch and render records
                    try {
                        const recordsGrid = document.getElementById('records-grid');
                        clear(recordsGrid);

                        recordsGrid.appendChild(recordCard(
                            'Fastest Solve',
                            records.fastest_runtime_ms ? `${records.fastest_runtime_ms} ms` : '—',
                            records.fastest_problem || 'No solves yet',
                            records.fastest_runtime_ms != null ? { to: Number(records.fastest_runtime_ms), suffix: ' ms' } : null
                        ));
                        recordsGrid.appendChild(recordCard(
                            'Hardest Solved',
                            records.hardest_difficulty ? records.hardest_difficulty.toUpperCase() : '—',
                            records.hardest_problem || 'No solves yet'
                        ));
                        recordsGrid.appendChild(recordCard(
                            'Total Solved',
                            records.total_solved,
                            'unique problems',
                            records.total_solved != null ? { to: Number(records.total_solved) } : null
                        ));
                    } catch (e) {
                        console.warn('Could not load records', e);
                    }

                    const accepted = items.filter(
                        s => s.verdict === 'AC'
                    );

                    const totalScore = accepted.reduce(
                        (sum, s) => sum + (s.score || 0), 0
                    );

                    const runtimes = accepted
                        .map(s => s.runtime_ms)
                        .filter(n => n != null && n > 0);

                    const bestRuntime = runtimes.length
                        ? Math.min(...runtimes)
                        : null;

                    const distinctProblems = new Set(
                        accepted.map(s => s.problem_id).filter(Boolean)
                    );

                    document.getElementById('subtitle').textContent =
                        `Member since ${formatDate(freshUser.created_at || new Date())}`;

                    const statsGrid =
                        document.getElementById('stats-grid');

                    clear(statsGrid);

                    statsGrid.appendChild(
                        statCard('Submissions', totalSubs, 'all time', { to: Number(totalSubs) || 0 })
                    );

                    statsGrid.appendChild(
                        statCard('Problems Solved', distinctProblems.size, 'distinct problems', { to: Number(distinctProblems.size) || 0 })
                    );

                    statsGrid.appendChild(
                        statCard('Score', totalScore, 'earned so far', { to: Number(totalScore) || 0, formatter: (n) => formatNumber(n) })
                    );

                    statsGrid.appendChild(
                        statCard(
                            'Best Runtime',
                            bestRuntime != null ? `${bestRuntime} ms` : '—',
                            'fastest AC',
                            bestRuntime != null ? { to: Number(bestRuntime), suffix: ' ms' } : null
                        )
                    );

                    const container =
                        document.getElementById('recent-table');

                    if (!items.length) {
                        emptyState(
                            container,
                            'No submissions yet',
                            'Head over to Problems and submit your first solution.'
                        );
                        return;
                    }

                    const table = el('table');

                    table.appendChild(el('thead', {}, [
                        el('tr', {}, [
                            el('th', { text: 'Problem' }),
                            el('th', { text: 'Language' }),
                            el('th', { text: 'Verdict' }),
                            el('th', { class: 'num', text: 'Runtime' }),
                            el('th', { class: 'num', text: 'Memory' }),
                            el('th', { text: 'Submitted' })
                        ])
                    ]));

                    const tbody = el('tbody');

                    items.forEach((s, i) => {
                        tbody.appendChild(el('tr', { class: 'anim-row', style: { '--i': String(i) } }, [
                            el('td', {}, [
                                el('a', {
                                    href: `submission.html?id=${s.id}`,
                                    text: s.problem_title ||
                                        `Problem ${s.problem_id}`
                                })
                            ]),
                            el('td', {
                                text: s.language || '—'
                            }),
                            el('td', {}, [
                                verdictBadge(s.verdict || s.status)
                            ]),
                            el('td', {
                                class: 'num',
                                text: s.runtime_ms != null
                                    ? `${s.runtime_ms} ms`
                                    : '—'
                            }),
                            el('td', {
                                class: 'num',
                                text: s.memory_kb != null
                                    ? `${formatNumber(s.memory_kb)} KB`
                                    : '—'
                            }),
                            el('td', {
                                class: 'muted',
                                text: formatDate(s.submitted_at)
                            })
                        ]));
                    });

                    table.appendChild(tbody);
                    clear(container);
                    container.appendChild(table);

                } catch (err) {
                    console.error('Failed to load dashboard:', err);
                    toast(friendlyErrorMessage(err, 'Failed to load dashboard'), 'error');
                }
            })();

            // ---- Load Global Activity Feed ----
            async function loadActivityFeed() {
                const feedContainer = document.getElementById('activity-feed');
                if (!feedContainer) return;
                try {
                    const events = await apiFetch('/api/activity/?limit=15');

                    if (!events || events.length === 0) {
                        feedContainer.innerHTML = '<p class="muted">No activity yet.</p>';
                        return;
                    }

                    clear(feedContainer);

                    events.forEach((e, i) => {
                        let iconSvg = '';
                        let content = null;

                        if (e.type === 'ac') {
                            iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>`;
                            content = el('div', { class: 'activity-content' }, [
                                el('div', {}, [
                                    el('strong', { text: e.username }),
                                    ' solved ',
                                    el('span', { class: 'accent', text: e.problem_title }),
                                    e.difficulty === 'hard' ? ' 🔥' : ''
                                ]),
                                el('div', { class: 'activity-time', text: formatDate(e.created_at) })
                            ]);
                        } else if (e.type === 'registration') {
                            iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>`;
                            content = el('div', { class: 'activity-content' }, [
                                el('div', {}, [
                                    el('strong', { text: e.username }),
                                    ' joined CodeArena'
                                ]),
                                el('div', { class: 'activity-time', text: formatDate(e.created_at) })
                            ]);
                        }

                        if (content) {
                            const iconEl = el('div', { class: `activity-icon ${e.type}` });
                            iconEl.innerHTML = iconSvg;
                            const item = el('div', { class: 'activity-item anim-rise', style: { '--stagger': String(Math.min(i, 8)) } }, [iconEl, content]);
                            feedContainer.appendChild(item);
                        }
                    });

                } catch (err) {
                    console.error('Failed to load activity', err);
                    feedContainer.innerHTML = '<p class="muted">Could not load activity.</p>';
                }
            }

            loadActivityFeed();

            // ---- Random Problem Button ----
            const randomProblemBtn = document.getElementById('random-problem-btn');
            if (randomProblemBtn) {
                randomProblemBtn.addEventListener('click', async (e) => {
                    const btn = e.currentTarget;
                    const originalText = btn.innerHTML;
                    btn.innerHTML = 'Finding...';
                    btn.disabled = true;

                    try {
                        const res = await apiFetch('/api/problems/random');
                        location.href = `problem.html?id=${res.id}`;
                    } catch (err) {
                        toast(err.message || 'Failed to find a problem', 'error');
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                });
            }

            // ---- Resume Last Problem ----
            function setupResumeCard() {
                const lastId = localStorage.getItem('codearena_last_problem');
                if (!lastId) return;

                const draftKey = 'codearena_source_' + lastId;
                const draft = localStorage.getItem(draftKey);

                if (!draft || draft.trim().length === 0) return; // No draft, don't show card

                const resumeCard = document.getElementById('resume-card');
                const resumeBtn = document.getElementById('resume-btn');
                const resumeDesc = document.getElementById('resume-desc');
                if (!resumeCard || !resumeBtn || !resumeDesc) return;

                // Fetch problem title (async, but we can show the card immediately)
                resumeBtn.href = `problem.html?id=${lastId}`;
                resumeCard.classList.remove('hidden');
                resumeCard.classList.add('anim-rise');

                apiFetch(`/api/problems/${lastId}`).then(p => {
                    resumeDesc.textContent = `You were working on "${p.title}".`;
                }).catch(() => {
                    resumeDesc.textContent = `You were working on a problem.`;
                });
            }

            // Call it on dashboard load
            setupResumeCard();

            // ---- Load Topic Mastery ----
            async function loadTopicMastery() {
                const container = document.getElementById('topic-mastery-container');
                if (!container) return;
                try {
                    const topics = await apiFetch('/api/users/me/topics');

                    if (!topics || topics.length === 0) {
                        container.innerHTML = '<p class="muted" style="font-size: 14px;">Solve problems with tags to see your mastery map.</p>';
                        return;
                    }

                    clear(container);
                    const grid = el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '16px' } });

                    topics.forEach(t => {
                        let barColor = 'var(--secondary)';
                        if (t.percentage >= 75) barColor = 'var(--success)';
                        else if (t.percentage >= 40) barColor = 'var(--warning)';

                        const topicEl = el('div', {}, [
                            el('div', { class: 'flex', style: { justifyContent: 'space-between', marginBottom: '6px', fontSize: '13px' } }, [
                                el('span', { style: { fontWeight: '600', textTransform: 'capitalize' }, text: String(t.tag || '').replace('-', ' ') }),
                                el('span', { class: 'muted', text: `${t.solved} / ${t.total}` })
                            ]),
                            el('div', { class: 'progress', style: { height: '6px' } }, [
                                el('div', { class: 'bar', 'data-progress': `${t.percentage}%`, style: { background: barColor } })
                            ])
                        ]);
                        grid.appendChild(topicEl);
                    });

                    container.appendChild(grid);
                    animateProgressBars(container);

                } catch (err) {
                    console.error('Failed to load topics', err);
                    container.innerHTML = '<p class="muted">Could not load topic mastery.</p>';
                }
            }

            loadTopicMastery();

            // ---- Load Weekly Goal & Recommendation ----
            async function loadRecommendations() {
                const goalContainer = document.getElementById('weekly-goal-container');
                const recContainer = document.getElementById('recommendation-container');
                if (!goalContainer || !recContainer) return;

                try {
                    const data = await apiFetch('/api/users/me/recommendations');

                    // --- Weekly Goal ---
                    clear(goalContainer);
                    const solved = (data.weekly_stats && data.weekly_stats.weekly_solved) || 0;
                    const target = 5; // Could be user-configurable later
                    const pct = Math.min(100, Math.round((solved / target) * 100));

                    goalContainer.appendChild(el('div', { class: 'flex', style: { justifyContent: 'space-between', marginBottom: '8px', fontSize: '14px' } }, [
                        el('span', { text: 'Solve 5 problems' }),
                        el('span', { style: { fontWeight: '600' }, text: `${solved} / ${target}` })
                    ]));
                    goalContainer.appendChild(el('div', { class: 'progress', style: { height: '8px', marginBottom: '12px' } }, [
                        el('div', { class: 'bar', 'data-progress': `${pct}%`, style: { background: pct === 100 ? 'var(--success)' : 'var(--tertiary)' } })
                    ]));
                    goalContainer.appendChild(el('p', { class: 'muted', style: { fontSize: '12px', margin: '0' }, text: pct === 100 ? '🎉 Goal reached for this week!' : `Keep going! ${target - solved} more to go.` }));

                    // --- Recommendation ---
                    clear(recContainer);
                    if (data.recommendation) {
                        const p = data.recommendation.problem;
                        recContainer.appendChild(el('p', { class: 'muted', style: { fontSize: '12px', marginTop: '0', marginBottom: '12px' }, text: data.recommendation.reason }));
                        recContainer.appendChild(el('h4', { style: { margin: '0 0 4px', fontFamily: 'var(--font-serif)', fontSize: '1.2rem' }, text: p.title }));
                        recContainer.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', marginTop: '8px' } }, [
                            difficultyBadge(p.difficulty),
                            el('a', { href: `problem.html?id=${p.id}`, class: 'btn secondary', text: 'Solve Now →', style: { padding: '4px 12px', fontSize: '12px' } })
                        ]));
                    } else {
                        recContainer.appendChild(el('p', { class: 'muted', text: 'You have solved everything! Amazing.' }));
                    }

                    animateProgressBars(goalContainer);

                } catch (err) {
                    console.error('Failed to load recommendations', err);
                    goalContainer.innerHTML = '<p class="muted">Unable to load goal.</p>';
                    recContainer.innerHTML = '<p class="muted">Unable to load recommendations.</p>';
                }
            }

            loadRecommendations();

            // ---- Contest Countdown ----
            let countdownInterval = null;

            async function loadContestCountdown() {
                const container = document.getElementById('contest-countdown-container');
                if (!container) return;
                try {
                    const contest = await apiFetch('/api/stats/next-contest');

                    if (!contest) {
                        container.innerHTML = '';
                        return;
                    }

                    const startTime = new Date(contest.start_time).getTime();
                    const endTime = new Date(contest.end_time).getTime();

                    const widget = el('div', { class: 'contest-widget', id: 'contest-widget' });

                    widget.innerHTML = `
                        <div class="contest-info">
                            <div class="contest-label" id="contest-status-label">Upcoming Contest</div>
                            <h3 class="contest-title">${contest.title}</h3>
                        </div>
                        <div class="contest-timer" id="contest-timer">
                            <div class="timer-block">
                                <div class="timer-value" id="t-days">00</div>
                                <div class="timer-label">Days</div>
                            </div>
                            <div class="timer-block">
                                <div class="timer-value" id="t-hours">00</div>
                                <div class="timer-label">Hours</div>
                            </div>
                            <div class="timer-block">
                                <div class="timer-value" id="t-mins">00</div>
                                <div class="timer-label">Mins</div>
                            </div>
                            <div class="timer-block">
                                <div class="timer-value" id="t-secs">00</div>
                                <div class="timer-label">Secs</div>
                            </div>
                        </div>
                    `;

                    container.innerHTML = '';
                    container.appendChild(widget);

                    function updateTimer() {
                        const now = Date.now();

                        if (now >= endTime) {
                            // Contest ended
                            container.innerHTML = '';
                            if (countdownInterval) clearInterval(countdownInterval);
                            return;
                        }

                        const isLive = now >= startTime;
                        const target = isLive ? endTime : startTime;
                        const diff = target - now;

                        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const secs = Math.floor((diff % (1000 * 60)) / 1000);

                        const pad = (n) => String(n).padStart(2, '0');
                        const dEl = document.getElementById('t-days');
                        const hEl = document.getElementById('t-hours');
                        const mEl = document.getElementById('t-mins');
                        const sEl = document.getElementById('t-secs');

                        const setNum = (el, val) => {
                            if (!el) return;
                            const s = pad(val);
                            if (el.textContent === s) return;
                            el.textContent = s;
                            el.classList.remove('tick');
                            void el.offsetWidth;
                            el.classList.add('tick');
                        };

                        setNum(dEl, days);
                        setNum(hEl, hours);
                        setNum(mEl, mins);
                        setNum(sEl, secs);

                        // Change styling if live
                        const widgetEl = document.getElementById('contest-widget');
                        const statusLabel = document.getElementById('contest-status-label');
                        if (widgetEl && statusLabel) {
                            if (isLive) {
                                if (!widgetEl.classList.contains('live')) {
                                    widgetEl.classList.add('live');
                                }
                                statusLabel.textContent = '🔴 Live Now — Ends in';
                            } else {
                                widgetEl.classList.remove('live');
                                statusLabel.textContent = 'Upcoming Contest — Starts in';
                            }
                        }
                    }

                    updateTimer();
                    if (countdownInterval) clearInterval(countdownInterval);
                    countdownInterval = setInterval(updateTimer, 1000);

                } catch (err) {
                    console.error('Failed to load contest countdown', err);
                    container.innerHTML = '';
                }
            }

            loadContestCountdown();

            function animateCountUp(el, to, { duration = 1200, delay = 120, suffix = '', prefix = '', formatter = (n) => String(n) } = {}) {
                if (!el || !isFinite(to)) return;
                const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const finalText = `${prefix}${formatter(Math.round(to))}${suffix}`;
                if (prefersReduced) {
                    el.textContent = finalText;
                    return;
                }
                el.textContent = `${prefix}${formatter(0)}${suffix}`;
                const startAnim = () => {
                    const start = performance.now();
                    function frame(now) {
                        const t = Math.min(1, (now - start) / duration);
                        const ease = 1 - Math.pow(1 - t, 3);
                        const v = Math.round(to * ease);
                        el.textContent = `${prefix}${formatter(v)}${suffix}`;
                        if (t < 1) requestAnimationFrame(frame);
                        else el.textContent = finalText;
                    }
                    requestAnimationFrame(frame);
                };
                setTimeout(startAnim, delay);
            }

            function statCard(label, value, sub, anim) {
                const valueEl = el('div', {
                    class: 'stat-value',
                    text: anim ? '' : String(value)
                });
                const card = el('div', { class: 'stat' }, [
                    el('div', {
                        class: 'stat-label',
                        text: label
                    }),
                    valueEl,
                    sub && el('div', {
                        class: 'stat-sub',
                        text: sub
                    })
                ]);
                if (anim) requestAnimationFrame(() => animateCountUp(valueEl, anim.to, anim));
                return card;
            }

            function recordCard(label, value, sub, anim) {
                const valueEl = el('div', { class: 'stat-value', text: anim ? '' : String(value), style: { fontSize: '1.8rem' } });
                const card = el('div', { class: 'stat', style: { borderLeft: '3px solid var(--tertiary)' } }, [
                    el('div', { class: 'stat-label', text: label }),
                    valueEl,
                    el('div', { class: 'stat-sub', text: sub })
                ]);
                if (anim) requestAnimationFrame(() => animateCountUp(valueEl, anim.to, anim));
                return card;
            }

            function renderOnboarding(freshUser, totalSubs) {
                const hasSubmitted = totalSubs > 0;
                const hasSetEditor = localStorage.getItem('codearena_lang') !== null;
                const hasProfile = Boolean(freshUser.bio || freshUser.avatar_url);
                const completedCount = [hasSubmitted, hasSetEditor, hasProfile]
                    .filter(Boolean).length;
                const container = document.getElementById('onboarding-container');

                if (
                    completedCount === 3 ||
                    localStorage.getItem('codearena_onboarding_dismissed') === '1'
                ) {
                    clear(container);
                    return;
                }

                const steps = [
                    {
                        title: 'Submit your first solution',
                        done: hasSubmitted,
                        href: 'problems.html',
                        actionText: 'Solve a problem →',
                    },
                    {
                        title: 'Set your preferred language',
                        done: hasSetEditor,
                        href: 'problem.html?id=1',
                        actionText: 'Open editor →',
                    },
                    {
                        title: 'Complete your profile',
                        done: hasProfile,
                        href: `profile.html?user=${encodeURIComponent(freshUser.username)}`,
                        actionText: 'Edit profile →',
                    },
                ];

                const card = el('div', { class: 'onboarding-card' });
                card.appendChild(el('div', { class: 'onboarding-header' }, [
                    el('div', {}, [
                        el('h3', { text: 'Getting Started' }),
                        el('p', { text: `${completedCount} of 3 completed` }),
                    ]),
                    el('button', {
                        class: 'onboarding-dismiss',
                        type: 'button',
                        title: 'Dismiss',
                        'aria-label': 'Dismiss onboarding checklist',
                        onclick: () => {
                            localStorage.setItem('codearena_onboarding_dismissed', '1');
                            clear(container);
                        },
                    }, [icon('close', 18)]),
                ]));

                const list = el('div', { class: 'onboarding-list' });
                steps.forEach(step => {
                    const row = step.done
                        ? el('div', { class: 'onboarding-step completed' }, [
                            el('div', { class: 'onboarding-check' }, [icon('check', 14)]),
                            el('div', { class: 'onboarding-text', text: step.title }),
                        ])
                        : el('a', { href: step.href, class: 'onboarding-step' }, [
                            el('div', { class: 'onboarding-check' }),
                            el('div', { class: 'onboarding-text', text: step.title }),
                            el('div', { class: 'onboarding-action', text: step.actionText }),
                        ]);
                    list.appendChild(row);
                });
                card.appendChild(list);

                const progress = el('div', { class: 'onboarding-progress' }, [
                    el('div', {
                        class: 'bar',
                        'data-progress': `${Math.round((completedCount / 3) * 100)}%`,
                    }),
                ]);
                card.appendChild(progress);
                animateProgressBars(card);

                clear(container);
                container.appendChild(card);
                card.classList.add('anim-rise');
            }
        })();
    </script>

    <script>
        'use strict';

        (function () {
            const container =
                document.getElementById('heatmap-container');

            if (!container) return;

            const MONTHS = [
                'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
            ];

            function levelFor(count) {
                if (count <= 0) return 0;
                if (count <= 2) return 1;
                if (count <= 5) return 2;
                if (count <= 10) return 3;
                return 4;
            }

            async function render() {
                let data;

                try {
                    data = await apiFetchWithRetry(
                        '/api/stats/heatmap?days=365'
                    );
                } catch (err) {
                    clear(container);

                    container.appendChild(
                        el('div', { class: 'empty' }, [
                            el('p', {
                                text: friendlyErrorMessage(err, 'Could not load submission activity.')
                            })
                        ])
                    );

                    console.error('Heatmap loading failed:', err);
                    return;
                }

                const start = new Date(data.start + 'T00:00:00Z');
                const end = new Date(data.end + 'T00:00:00Z');

                const startSunday = new Date(start);

                startSunday.setUTCDate(
                    startSunday.getUTCDate() -
                    startSunday.getUTCDay()
                );

                const days = [];
                const cursor = new Date(startSunday);

                while (cursor <= end) {
                    const key = cursor.toISOString().slice(0, 10);
                    const inRange = cursor >= start && cursor <= end;

                    days.push({
                        date: new Date(cursor),
                        key,
                        count: inRange
                            ? (data.days[key] || 0)
                            : -1,
                        inRange
                    });

                    cursor.setUTCDate(cursor.getUTCDate() + 1);
                }

                const columns = [];

                for (let i = 0; i < days.length; i += 7) {
                    columns.push(days.slice(i, i + 7));
                }

                clear(container);

                const card = el('div', {
                    class: 'heatmap-card'
                });

                const header = el('div', {
                    class: 'heatmap-header'
                }, [
                    el('h3', {
                        text: 'Submission Activity'
                    }),
                    el('span', {
                        class: 'heatmap-total',
                        text: `${data.total || 0} submission${data.total === 1 ? '' : 's'} in the last year`
                    })
                ]);

                card.appendChild(header);

                const scroll = el('div', {
                    class: 'heatmap-scroll'
                });

                const outer = el('div');

                /*
                 * Month labels and week columns use matching slots.
                 * Month starts receive the same visual gap in both rows.
                 */
                const monthLabels = el('div', {
                    class: 'heatmap-months'
                });

                const monthStarts = [];
                let lastMonth = -1;

                for (const week of columns) {
                    const monthDay = week.find(day =>
                        day &&
                        day.inRange &&
                        day.date.getUTCDate() === 1
                    );

                    const firstInRange = week.find(day =>
                        day && day.inRange
                    );

                    const labelDay = monthDay || firstInRange;

                    const month = labelDay
                        ? labelDay.date.getUTCMonth()
                        : -1;

                    const startsMonth =
                        Boolean(monthDay && month !== lastMonth);

                    monthStarts.push(startsMonth);

                    let label = '';

                    if (labelDay && month !== lastMonth) {
                        label = MONTHS[month];
                        lastMonth = month;
                    }

                    monthLabels.appendChild(
                        el('span', {
                            class: startsMonth
                                ? 'month-label month-start'
                                : 'month-label',
                            text: label
                        })
                    );
                }

                outer.appendChild(monthLabels);

                /*
                 * IMPORTANT:
                 * Declare columnsContainer before appending week columns.
                 * This avoids the ReferenceError from the previous version.
                 */
                const grid = el('div', {
                    class: 'heatmap-grid'
                });

                const columnsContainer = el('div', {
                    class: 'heatmap-columns'
                });

                for (
                    let weekIndex = 0;
                    weekIndex < columns.length;
                    weekIndex++
                ) {
                    const week = columns[weekIndex];

                    const startsMonth = monthStarts[weekIndex];

                    const weekCol = el('div', {
                        class: startsMonth
                            ? 'heatmap-week month-start'
                            : 'heatmap-week'
                    });

                    for (let dow = 0; dow < 7; dow++) {
                        const day = week[dow];

                        if (!day || !day.inRange) {
                            weekCol.appendChild(
                                el('div', {
                                    class: 'heatmap-cell',
                                    style: {
                                        visibility: 'hidden'
                                    }
                                })
                            );

                            continue;
                        }

                        const level = levelFor(day.count);
                        const cell = el('div', {
                            class: `heatmap-cell level-${level}`,
                            'data-date': day.key,
                            'data-count': String(day.count),
                            title: `${day.count} submission${day.count === 1 ? '' : 's'} on ${day.key}`,
                            onclick: () => {
                                if (day.count > 0) {
                                    openDayModal(day.key, day.count);
                                }
                            },
                            style: day.count > 0 ? { cursor: 'pointer' } : {}
                        });

                        weekCol.appendChild(cell);
                    }

                    columnsContainer.appendChild(weekCol);
                }

                grid.appendChild(columnsContainer);
                outer.appendChild(grid);

                const legend = el('div', {
                    class: 'heatmap-legend'
                }, [
                    el('span', { text: 'Less' }),
                    el('div', { class: 'heatmap-cell level-0' }),
                    el('div', { class: 'heatmap-cell level-1' }),
                    el('div', { class: 'heatmap-cell level-2' }),
                    el('div', { class: 'heatmap-cell level-3' }),
                    el('div', { class: 'heatmap-cell level-4' }),
                    el('span', { text: 'More' })
                ]);

                scroll.appendChild(outer);
                card.appendChild(scroll);
                card.appendChild(legend);
                container.appendChild(card);

                attachTooltip(card);
            }

            function attachTooltip(scope) {
                const tooltip = el('div', {
                    class: 'heatmap-tooltip'
                });

                document.body.appendChild(tooltip);

                scope.addEventListener('mouseover', event => {
                    const cell = event.target.closest(
                        '.heatmap-cell[data-date]'
                    );

                    if (!cell) return;

                    const count = Number(cell.dataset.count);

                    const date = new Date(
                        cell.dataset.date + 'T00:00:00Z'
                    );

                    const formatted = date.toLocaleDateString(
                        undefined,
                        {
                            weekday: 'short',
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            timeZone: 'UTC'
                        }
                    );

                    tooltip.textContent =
                        `${count} submission${count === 1 ? '' : 's'} on ${formatted}`;

                    tooltip.classList.add('visible');
                });

                scope.addEventListener('mousemove', event => {
                    const cell = event.target.closest(
                        '.heatmap-cell[data-date]'
                    );

                    if (!cell) {
                        tooltip.classList.remove('visible');
                        return;
                    }

                    const rect = cell.getBoundingClientRect();

                    tooltip.style.left = `${Math.max(
                        8,
                        Math.min(
                            window.innerWidth - tooltip.offsetWidth - 8,
                            rect.left + rect.width / 2 -
                            tooltip.offsetWidth / 2
                        )
                    )}px`;

                    tooltip.style.top = `${Math.max(
                        8,
                        rect.top - tooltip.offsetHeight - 8
                    )}px`;
                });

                scope.addEventListener('mouseout', event => {
                    if (
                        !event.relatedTarget ||
                        !event.relatedTarget.closest(
                            '.heatmap-cell[data-date]'
                        )
                    ) {
                        tooltip.classList.remove('visible');
                    }
                });
            }

            // ---- Heatmap Day Modal ----
            async function openDayModal(dateStr, count) {
                const modal = document.getElementById('day-modal');
                const title = document.getElementById('day-modal-title');
                const content = document.getElementById('day-modal-content');

                // Setup modal UI
                const d = new Date(dateStr + 'T00:00:00Z');
                const formattedDate = d.toLocaleDateString(undefined, {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'
                });
                title.textContent = `Submissions on ${formattedDate}`;

                content.innerHTML = `<div class="loading-block" style="padding: 40px;"><span class="spinner"></span><span>Loading...</span></div>`;

                modal.classList.add('visible');

                try {
                    const subs = await Api.getSubmissionsByDate(dateStr);

                    if (subs.length === 0) {
                        content.innerHTML = '<p class="muted" style="padding: 24px;">No submissions found for this date.</p>';
                        return;
                    }

                    content.innerHTML = '';

                    const table = el('table');
                    table.appendChild(el('thead', {}, [
                        el('tr', {}, [
                            el('th', { text: 'Problem' }),
                            el('th', { text: 'Lang' }),
                            el('th', { text: 'Verdict' }),
                            el('th', { class: 'num', text: 'Runtime' }),
                            el('th', { text: 'Time' })
                        ])
                    ]));

                    const tbody = el('tbody');
                    subs.forEach((s, i) => {
                        // Format time
                        const timeStr = new Date(s.submitted_at).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

                        tbody.appendChild(el('tr', { class: 'anim-row', style: { '--i': String(i) } }, [
                            el('td', {}, [
                                el('a', { href: `submission.html?id=${s.id}`, text: s.problem_title || `Problem ${s.problem_id}` })
                            ]),
                            el('td', { text: s.language }),
                            el('td', {}, [verdictBadge(s.verdict || s.status)]),
                            el('td', { class: 'num', text: s.runtime_ms != null ? `${s.runtime_ms} ms` : '—' }),
                            el('td', { class: 'muted', text: timeStr })
                        ]));
                    });

                    table.appendChild(tbody);
                    content.appendChild(table);

                } catch (err) {
                    content.innerHTML = `<p class="error" style="padding: 24px;">${err.message || 'Failed to load submissions'}</p>`;
                }
            }
            window.openDayModal = openDayModal;

            render();
        })();
    </script>

    <!-- Heatmap Day Modal -->
    <div id="day-modal" class="shortcuts-backdrop" style="z-index: 1050;">
        <div class="shortcuts-modal" style="max-width: 600px;">
            <div class="shortcuts-header">
                <h2 id="day-modal-title">Submissions</h2>
                <button class="shortcuts-close" onclick="document.getElementById('day-modal').classList.remove('visible');">✕</button>
            </div>
            <div class="shortcuts-body" style="padding: 0;">
                <div id="day-modal-content">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>
</body>
